[package]
name = "gameboy"
version = "0.2.0"
description = "Game Boy / Game Boy Color emulator in Rust — desktop, terminal, and WebAssembly"
# This is a fork of raphamorim/gameboy (itself modelled on mvdnes/rboy). Under
# MPL-2.0 the upstream authorship stays credited; see README "Credits & lineage".
authors = [
    "Raphael Amorim <rapha850@gmail.com>",
    "gameboy contributors",
]
repository = "https://github.com/Alchemy86/gameboy"
license = "MPL-2.0"
edition = "2021"

[lib]
name = "gameboy"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["libc", "glutin", "gl" ,"ratatui" ,"icy_sixel", "image", "ratatui-image"]
# Real host-audio output via cpal. OFF by default because cpal pulls in ALSA
# (libasound2-dev / alsa-lib-devel) on Linux, which would make a fresh clone
# fail to build. Enable with `--features audio` once ALSA dev headers are
# installed. The APU is always emulated; only speaker playback is gated.
audio = ["cpal"]
ffi = []
ffi-base64 = ["image", "base64"]

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
debug = 0
panic = 'abort'
codegen-units = 1
incremental = false

[profile.dev]
split-debuginfo = "unpacked"
lto = false
incremental = true
opt-level = 0

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = { version = "0.2.126", optional = true }
glutin = { version = "0.28.0", optional = true }
gl = { version = "0.14.0", optional = true }
ratatui = { version = "^0.29.0", features = ["crossterm"], optional = true }
icy_sixel = { version = "^0.1.1", optional = true }
image = { version = "^0.25.1", default-features = false, features = ["jpeg", "png"], optional = true }
ratatui-image = { version = "4.2.0", optional = true }
base64 = { version = "0.21.7", optional = true }
blip_buf = "0.1.4"
cpal = { version = "0.16.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.59"
wasm-bindgen = "0.2.82"
wasm-bindgen-futures = "0.4.32"
console_error_panic_hook = "0.1.7"
web-sys = {version = "0.3.4", features = [
  'Document',
  'Element',
  'HtmlCanvasElement',
  'CanvasRenderingContext2d',
  'ImageData',
  'Window',
  'KeyboardEvent',
]}

#'WebGlBuffer',
#'WebGlRenderingContext',
#'ImageBitmap',
#'WebGlProgram',
#'WebGlShader',

[[example]]
name = "desktop"
path = "examples/desktop/bin.rs"

[[example]]
name = "terminal"
path = "examples/terminal/bin.rs"

# Headless test-ROM correctness harness. `harness = false` gives it its own
# main() so it can print a pass count and control the process exit code (red on
# regression). See testharness/testroms.rs and docs/testing.md.
[[test]]
name = "testroms"
path = "testharness/testroms.rs"
harness = false

# Save-state round-trip proof. `harness = false` so it can print progress and
# control the exit code. See testharness/savestate.rs.
[[test]]
name = "savestate"
path = "testharness/savestate.rs"
harness = false

# Battery-backed save durability harness: proves an in-game save reaches disk
# while the emulator runs (not only on a clean exit), stays readable bank by
# bank, and interoperates with `.sav` files. See testharness/battery.rs.
[[test]]
name = "battery"
path = "testharness/battery.rs"
harness = false

# Headless audio-capture harness: records the APU's produced samples with no
# audio device, writes WAVs, analyses them (rate/level/silence/discontinuity/
# pitch) and pins an FNV hash baseline. See testharness/audiocapture.rs and
# docs/audio.md.
[[test]]
name = "audiocapture"
path = "testharness/audiocapture.rs"
harness = false

# Emulation speed with a host audio player attached. `harness = false` so it
# can print the measured numbers and control the exit code. Needs the `audio`
# feature but NOT a sound card — see testharness/audioperf.rs.
[[test]]
name = "audioperf"
path = "testharness/audioperf.rs"
harness = false

# Trainer-view harness: proves the Gen 1 RAM reader and the sprite
# decompressor against a real Pokémon Red/Blue cartridge, and prints the live
# party so it can be compared with the game. Skips (exit 0) with no cartridge.
# See testharness/trainer.rs.
[[test]]
name = "trainer"
path = "testharness/trainer.rs"
harness = false
