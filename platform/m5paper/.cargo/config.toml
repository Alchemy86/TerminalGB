[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"
rustflags = [
    # esp-hal ships the linker script and puts its directory on the link search
    # path from its build.rs. Without this the image has no entry symbol and the
    # linker silently defaults it to 0x00400094, producing a binary that flashes
    # and then does nothing.
    "-C",
    "link-arg=-Tlinkall.x",
]

[unstable]
build-std = ["core", "alloc"]
