<html>
  <head>
    <title>TerminalGB — a Game Boy emulator in Rust + WebAssembly</title>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type"/>
    <link rel="stylesheet" href="app.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link rel="shortcut icon" href="https://raphamorim.io/assets/images/favicon.png" type="image/x-icon" />
  </head>
  <style type="text/css">
    html, body { height: 100%; overflow: hidden }

    /* Before a ROM is loaded #game is the little placeholder inside the
       decorative Game Boy shell. */
    #game { width: 160px; height: 144px; background: black; }

    /* Once the wasm renderer appends its <canvas>, blow the screen up to fill
       the viewport: a black, flex-centred backdrop (this is the letterbox)
       holding the integer-scaled canvas. Keyboard controls drive the emulator,
       so covering the decorative on-screen buttons costs nothing. */
    #game:not(:empty) {
      position: fixed;
      inset: 0;
      width: auto; height: auto;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    /* Keep every Game Boy pixel a hard square when the canvas is scaled up.
       Without this the browser bilinear-smooths the upscale and blurs it.
       `pixelated` is listed last so modern browsers prefer it; the earlier
       values are fallbacks for Firefox / Safari / older WebKit. */
    #game canvas {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      display: block;
      /* width/height are set by fitCanvas() to the largest integer multiple. */
    }
  </style>
  <body>
    <div class="theater"></div>
    <div class="helper">
        <p>
          <strong>Directional</strong><br/>
          Up, Down, Left, Right
        </p>
        <p>
          <strong>A</strong><br/>
          A
        </p>
        <p>
          <strong>B</strong><br/>
          S
        </p>
        <p>
          <strong>Select</strong><br/>
          Z
        </p>
        <p>
          <strong>Start</strong><br/>
          X
        </p>
    </div>
    <div class="menu">
      <p>
        <a href="https://github.com/raphamorim/gameboy">github.com/raphamorim/gameboy</a>
      </p>
      <p>
          <strong><label for="rom">Select a rom file to play</label></strong><br/>
          <input type="file" id="file" />
        </p>
        <p>
          <strong>Click once you have selected the rom</strong></br>
          <button id="play" disabled class="btn">Load Game</button>
        </p>
    </div>
    <div class="container">
      <main class="gameboy">
        <div class="gameboy-body">  
        <header></header>
        <section class="screen">
          <span></span>
          <div class="glass" id="game"></div>
        </section>
        <section class="actions">
         <div class="directions">
          <button class="arrow-left"></button>
          <button class="arrow-top"></button>
          <button class="arrow-right"></button>
          <button class="arrow-bottom"></button>
         </div>
         <div class="buttons">
          <button class="button-a"></button>
          <button class="button-b"></button>
         </div>
         <ul class="start-reset">
          <li><button class="start"></button></li>
          <li><button class="reset"></button></li>
         </ul>
         <div class="points">
          <span>•••••</span><br>
          <span>•••••••</span><br>
          <span>•••••</span><br>
          <span>••••••</span><br>
          <span>••••</span>
         </div>
        </section>
       </div>
      </main>
    </div>
  </body>
  <script type="module" src="index.js"></script>
</html>
