[package]
name = "terminalgb-surfing-pikachu"
version = "0.1.0"
description = "Surfing Pikachu — a standalone Rust port of the Pokemon Yellow minigame, played in a terminal"
authors = ["TerminalGB contributors"]
repository = "https://github.com/Alchemy86/TerminalGB"
license = "MPL-2.0"
edition = "2021"
rust-version = "1.83"
publish = false

[lib]
name = "surfing_pikachu"
path = "src/lib.rs"

[[bin]]
name = "surfing-pikachu"
path = "src/bin/surfing-pikachu.rs"
required-features = ["terminal"]

[features]
default = ["terminal"]
terminal = ["terminalgb", "ratatui", "art"]
# The PNG decoder for pret's extracted art, and nothing else. Its own feature
# because the library is meant to be embedded: a host that wants
# `game` + `render` + the real art should not have to link an emulator and a
# terminal UI framework to get a picture decoder. `--no-default-features`
# alone has NO dependencies at all and draws the built-in art.
art = ["image"]

[dependencies]
terminalgb = { path = "../..", default-features = false, features = ["tui"], optional = true }
ratatui = { version = "^0.29.0", features = ["crossterm"], optional = true }
image = { version = "^0.25.1", default-features = false, features = ["png"], optional = true }
