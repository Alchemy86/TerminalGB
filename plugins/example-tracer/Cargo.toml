[package]
name = "terminalgb-plugin-example-tracer"
version = "0.1.0"
description = "A complete, minimal example plugin — watches one address and reports what changes it"
authors = ["TerminalGB contributors"]
repository = "https://github.com/Alchemy86/TerminalGB"
license = "MPL-2.0"
edition = "2021"
rust-version = "1.83"

[lib]
name = "terminalgb_plugin_example_tracer"
path = "src/lib.rs"

# The only dependency a plugin needs. Note what is NOT here: the emulator.
[dependencies]
terminalgb-plugin-api = { path = "../../crates/terminalgb-plugin-api", version = "0.1.0" }
