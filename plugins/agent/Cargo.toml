[package]
name = "terminalgb-plugin-agent"
version = "0.1.0"
description = "AI agent substrate: observe the game, plan, press the buttons, narrate — under a budget"
authors = ["TerminalGB contributors"]
repository = "https://github.com/Alchemy86/TerminalGB"
license = "MPL-2.0"
edition = "2021"
rust-version = "1.83"

[lib]
name = "terminalgb_plugin_agent"
path = "src/lib.rs"

[dependencies]
terminalgb-plugin-api = { path = "../../crates/terminalgb-plugin-api", version = "0.1.0" }
terminalgb-plugin-trainer = { path = "../trainer", version = "0.1.0" }
terminalgb-plugin-gen1-link = { path = "../gen1-link", version = "0.1.0" }
