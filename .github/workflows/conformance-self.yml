name: Conformance (self)

# We publish a conformance tool, so our own emulator has to be scored by it —
# publicly, on every push, with the number kept honest.
#
# `docs/conformance.md` calls this the credibility requirement: a suite whose
# author quietly fails their own checks is worthless. So this job
#
#   1. runs the runner's own unit tests (it is the part that has to work in
#      other people's repositories, where nothing else will catch a mistake),
#   2. scores this emulator through the SAME composite action an external
#      project would call — no private path, no shortcut,
#   3. fails if the score drops below 100%, and
#   4. fails if the committed badge (docs/conformance-badge.json, which the
#      README renders) has drifted from the real result.
#
# Step 4 is the part that stops the badge lying. Regenerate it deliberately:
#
#   cargo build --release --example conformance_adapter
#   python3 tools/conformance/gbconform.py \
#       --adapter target/release/examples/conformance_adapter \
#       --roms-dir tests --no-fetch --out target/conformance
#   cp target/conformance/badge.json docs/conformance-badge.json

# Every branch push that also has a pull request open used to run this whole
# workflow TWICE — once for `push`, once for `pull_request` — so a PR branch
# billed double the Actions minutes for two byte-identical results. That is
# what exhausted the account's spending limit, and GitHub then refuses to start
# *any* job: every check on the PR reports "The job was not started because
# recent account payments have failed or your spending limit needs to be
# increased", which reads as a repository-wide test failure and is not one.
#
# `push` is therefore limited to `main` (the branch nothing opens a PR against,
# so it would otherwise get no coverage at all) and everything else is covered
# exactly once by `pull_request`. The `concurrency` group is the other half:
# pushing a fix to a branch cancels the superseded run instead of paying for
# both. `main` is deliberately never cancelled — its runs are the published
# record.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  self:
    name: Score ourselves
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # Blargg ROMs; the fetch path is exercised below

      - uses: Swatinem/rust-cache@v2

      - name: Runner unit tests
        run: python3 -m unittest discover -s tools/conformance -p 'test_*.py' -v

      # The reference implementation of the adapter contract.
      - name: Build the reference adapter
        run: cargo build --release --example conformance_adapter

      # Exactly what an external project runs, pointed at ourselves. The
      # submodule is already present, so `roms-dir` is used and no download
      # happens — the fetch path gets its own job below.
      - name: Conformance
        id: conformance
        uses: ./.github/actions/conformance
        with:
          adapter: target/release/examples/conformance_adapter
          roms-dir: tests
          fail-below: "100"
          output-dir: target/conformance

      - name: The committed badge must match the real score
        run: |
          set -eu
          if ! diff -u docs/conformance-badge.json target/conformance/badge.json; then
            echo "::error::docs/conformance-badge.json is stale — the README badge"
            echo "::error::would show a score this build did not produce."
            exit 1
          fi
          echo "badge is current: $(cat docs/conformance-badge.json | tr -d '\n ')"

  # The path every external caller actually takes: no submodule, ROMs fetched
  # from their own upstream at the pinned commit. Worth its own job because it
  # is the one that breaks silently when an upstream mirror moves.
  fetch-path:
    name: Score ourselves with fetched ROMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        # deliberately WITHOUT submodules
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --example conformance_adapter
      - uses: ./.github/actions/conformance
        with:
          adapter: target/release/examples/conformance_adapter
          fail-below: "100"
          label: conformance (fetched)
          artifact-name: conformance-results-fetched
          output-dir: target/conformance-fetched

  gbselftest:
    name: GBSelfTest cartridge
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # The vendored cartridge must be the one the lock pins. This is the check
      # that catches somebody editing the artefact in place instead of fixing
      # it upstream, and it needs no network.
      - name: The vendored cartridge is the pinned one
        run: tools/fetch-gbselftest.sh --verify

      # ...and the documentation page its failures point at must still say what
      # the ROM says, or a printed URL lands on a heading that has drifted.
      - name: docs/gbselftest.md matches the vendored check reference
        run: python3 docs/tools/gbselftest_doc.py --check

      - name: Build the reference adapter
        run: cargo build --release --example conformance_adapter

      # Both picture modes, because they are expected to differ and the
      # difference is the interesting part: the per-dot renderer must pass
      # everything, and the whole-scanline renderer must lose exactly its five
      # documented approximations. A sixth is news either way.
      - name: Score both picture modes
        run: python3 tools/gbselftest-gate.py
