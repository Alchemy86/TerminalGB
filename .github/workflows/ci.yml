name: CI

on: [push, pull_request]

jobs:
  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu

    env:
      RUSTFLAGS: "-C target-cpu=native"
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive   # test ROMs live in the tests/ submodule
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: rustup component add rustfmt clippy
      - name: Install ALSA development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fetch
      - run: make lint
      # Audio is OFF by default, so `make lint` never compiles the cpal module —
      # which is how four unused-variable warnings (each discarding a real
      # audio-device error) survived in the tree. ALSA headers are installed
      # above, so lint and build the feature explicitly.
      - name: Lint with the audio feature enabled
        run: make lint-audio
      - name: Build with the audio feature enabled
        run: cargo build --release --features audio
      # Emulation speed WITH a host audio player attached. Nothing else in CI
      # measures this: every benchmark we had ran headless with no player, so a
      # player that blocked inside `Cpu::do_cycle` reported a healthy 0.246 ms
      # here while the captain's real session emulated at 17.93 ms/frame and
      # displayed 6 fps. Needs the `audio` feature but no sound card — see
      # testharness/audioperf.rs.
      - name: Emulation speed with audio attached
        run: cargo test --release --features audio --test audioperf
      - name: cargo test build
        run: cargo build --tests --release
      - name: cargo test
        run: cargo test --release
      # The MCP server, driven the way a client drives it: the harness spawns
      # the real `terminalgb-mcp` binary and speaks JSON-RPC to it. `make lint`
      # never compiles the feature, and a protocol bug is invisible to every
      # other test here — a server that starts is not a server that works.
      # Needs only the vendored dmg-acid2 ROM. See docs/mcp.md.
      - name: MCP server
        run: make test-mcp
      # The chiptune renderer, judged by properties of the audio it produces —
      # the envelope's 64 Hz counter, the sweep's overflow disable, the 7-bit
      # LFSR's 127-bit period, the duty spectra — against numbers from Pan Docs
      # rather than from our own previous output. `cargo test --release` above
      # already runs it; this step exists so the measured table is a named,
      # greppable part of the log. ~2 s. See docs/chiptune.md.
      - name: Chiptune renderer
        run: make test-chiptune
      - name: Make desktop build
        run: cd ./examples/desktop && cargo build
      # The web build. Audio is compiled out on wasm; a fresh clone must keep building it.
      # `make check-wasm` first: it type-checks BOTH wasm builds — the embedding
      # core (`--no-default-features`, which this release build alone would not
      # cover) and the default-features web build — and it is the same command
      # the local gates run (`make embed` depends on it), so CI and a laptop
      # measure the same thing. See AGENTS.md "GitHub CI cannot protect the
      # wasm build" for the break that motivated it.
      - name: wasm build
        run: |
          make check-wasm
          cargo build --release --target wasm32-unknown-unknown
      # **The plugin crates' own tests were not being run at all.** The root
      # `Cargo.toml` is both a `[package]` and a `[workspace]`, so the plain
      # `cargo test --release` step earlier in this job covers the `terminalgb`
      # package **only**: 263 tests across `plugins/*` and
      # `crates/*` were invisible to CI, including every plugin's unit suite and
      # the whole hermetic proof of the shiny hunter's driver loop
      # (docs/shiny-hunt.md §9).
      #
      # **Its own `CARGO_TARGET_DIR`, and that is not tidiness.** Building the
      # workspace pulls in `plugins/battle-control`'s dev-dependency on
      # `terminalgb` (feature `testing`), so the package gets built twice with
      # different features into one directory: cargo warns "output filename
      # collision", and every later single-target `cargo test --test X` in that
      # directory fails to compile with a panic-strategy mismatch until
      # `cargo clean -p terminalgb --release`. Reproduced deterministically.
      # A separate directory sidesteps it and costs nothing a warm cache does
      # not already pay.
      #
      # `--exclude terminalgb` rather than a plain `--workspace`, deliberately:
      # under `--workspace` the root package's doc-tests are collected with the
      # `testing` feature *visible* but compile without it, so
      # `src/testing.rs`'s example fails with "could not find `testing` in
      # `terminalgb`". That is a real (pre-existing) wrinkle in how that example
      # is written, not something this line should paper over or trip on — the
      # root package is already fully tested by the `cargo test --release` step.
      - name: cargo test (the plugin crates)
        run: CARGO_TARGET_DIR=target/plugin-tests cargo test --release --workspace --exclude terminalgb
      # Fail if any generated `path:line` doc link is broken (missing file or out-of-range
      # line). See docs/codemap.md and `make docs-links`.
      - name: docs link check
        run: make docs-check

  # The embedding build: the core with NO features at all. This job deliberately
  # installs no system libraries and runs on a runner with no display and no
  # sound card, because that is what someone pulling this crate into their own
  # UI or a hardware project has. If a frontend concern ever leaks back into the
  # core, this is what turns red. See README "Embedding the core".
  embed:
    name: Embeddable core (no default features)
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v3   # deliberately NO submodules: the ROM below is vendored
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install stable --profile minimal
      - run: rustup component add clippy
      - name: Build, lint and test the core alone
        run: |
          cargo build --release --no-default-features
          cargo clippy --release --no-default-features --all-targets -- -D warnings
          cargo test  --release --no-default-features --lib
      # One THIRD-PARTY dependency, and it must stay that way. `blip_buf` is
      # the APU's resampler; anything else appearing here means a frontend
      # crate has leaked into the core's default path.
      #
      # `terminalgb-plugin-api` is allowed beside it and is not a loosening of
      # this rule: it is first-party, in this repository, has no dependencies
      # of its own, and is the code that used to be `src/plugin/mod.rs`. It
      # became a crate so that plugin crates can depend on the contract without
      # depending on the emulator — see docs/writing-a-plugin.md §8. An
      # embedder gains no new third-party code.
      - name: The core has exactly one third-party dependency
        run: |
          deps=$(cargo tree --no-default-features --edges normal --prefix none \
                 | sort -u | grep -v '^terminalgb ' | grep -v '^terminalgb-plugin-api ')
          echo "$deps"
          test "$deps" = "$(printf '%s' "$deps" | head -1)" || { echo "more than one dependency"; exit 1; }
          case "$deps" in blip_buf*) ;; *) echo "unexpected dependency"; exit 1 ;; esac
      # No plugin may be reachable from the core, or "the plugins are optional"
      # is a claim rather than a fact. See `make no-plugins`.
      - name: No plugin is in the core, or the frontends
        run: make no-plugins
      # Run a real cartridge with no HOME, no display and no audio device. The
      # example exits non-zero if the save-state round trip diverges.
      - name: Run a ROM headless with no HOME and no display
        run: |
          env -u HOME -u XDG_CONFIG_HOME -u XDG_STATE_HOME -u DISPLAY -u WAYLAND_DISPLAY \
            cargo run --release --no-default-features --example headless -- \
            third_party/dmg-acid2/dmg-acid2.gb 240
      # Type-check the core for the platforms we cannot run here. These are
      # checks, not linked binaries — see the README's honest portability list.
      - name: Cross-check the core on other targets
        run: |
          for t in wasm32-unknown-unknown x86_64-pc-windows-gnu aarch64-unknown-linux-gnu; do
            rustup target add "$t"
            cargo check --no-default-features --lib --target "$t"
          done

  testroms:
    name: Test-ROM correctness harness
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive   # Blargg ROMs live in the tests/ submodule
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-gnu
      - name: Install ALSA development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Runs every ROM on BOTH consoles (DMG and CGB) headlessly and compares against
      # testharness/baseline.txt; red on any change from it, in either direction.
      # Verdicts are the ROM's own (serial string / cartridge RAM / the reference image
      # shipped with dmg-acid2) — never a hash of our own output, which cannot fail.
      # Two self-checks run first and abort if the comparison is vacuous. ~4s to run.
      - name: Run test-ROM harness
        run: cargo test --release --test testroms
      # `testroms` only ever exercises whichever engine is the default. This
      # asks the *other* one the same questions: pixel-exact on dmg-acid2
      # against its author's reference, frame-identical to the default engine
      # on well-behaved ROMs, and still comfortably faster than real time.
      # See testharness/ppuengines.rs.
      - name: Run both PPU engines against each other
        run: cargo test --release --test ppuengines
      # On any baseline mismatch the harness dumps the actual frame(s) — keep them.
      - name: Upload frame artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testrom-frames
          path: target/testrom-artifacts/*.png
          if-no-files-found: ignore

  # The external suites: Mooneye GB, SameSuite and Mealybug Tearoom — 266 rows
  # that nothing in CI used to look at. Every point those suites measure was
  # protected by somebody remembering to re-run a scout by hand, which is how a
  # night that gained +96 rows could have lost them again unnoticed.
  #
  # The ROMs are NOT vendored: they are other people's work under other people's
  # licences, so they are fetched at run time from the versions pinned in
  # tools/fetch-test-suites.sh — the same "fetch, never vendor" pattern
  # conformance.yml uses for Blargg's ROMs, for the same reason.
  #
  # The expectations (testharness/*_baseline.txt) are the ROMs' own verdicts,
  # never a hash of our output, and the job is red on ANY change in either
  # direction. ~20s to fetch, ~2s to run all five groups.
  external-suites:
    name: External suites (Mooneye / SameSuite / Mealybug / cpp)
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v3       # no submodules: none of these live here
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-gnu
      - name: Fetch the suites (pinned; never vendored)
        run: make fetch-test-suites
      - name: Score every external suite against its baseline
        run: make test-external
      # …and the two PPU-bearing suites again on the OTHER rendering engine.
      # `test-external` scores whichever engine is the default, so without this
      # the per-dot pixel FIFO — whose whole purpose is these suites — is
      # gated by nobody, and both its progress and its regressions would be
      # invisible. Its baselines carry their own pixel counts, so a change to
      # the pipeline shows up whether or not it moves a row.
      - name: Score the accurate PPU engine against its own baseline
        run: make test-external-accurate
      # Mealybug writes the frame it produced for every ROM; on a red build
      # those are what tells you *how* the PPU changed.
      - name: Upload Mealybug frames on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mealybug-frames
          path: target/mealybug/*.png
          if-no-files-found: ignore
