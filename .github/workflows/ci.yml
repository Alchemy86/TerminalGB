name: CI

on: [push, pull_request]

jobs:
  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu

    env:
      RUSTFLAGS: "-C target-cpu=native"
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive   # test ROMs live in the tests/ submodule
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: rustup component add rustfmt clippy
      - name: Install ALSA development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fetch
      - run: make lint
      # Audio is OFF by default, so `make lint` never compiles the cpal module —
      # which is how four unused-variable warnings (each discarding a real
      # audio-device error) survived in the tree. ALSA headers are installed
      # above, so lint and build the feature explicitly.
      - name: Lint with the audio feature enabled
        run: make lint-audio
      - name: Build with the audio feature enabled
        run: cargo build --release --features audio
      # Emulation speed WITH a host audio player attached. Nothing else in CI
      # measures this: every benchmark we had ran headless with no player, so a
      # player that blocked inside `Cpu::do_cycle` reported a healthy 0.246 ms
      # here while the captain's real session emulated at 17.93 ms/frame and
      # displayed 6 fps. Needs the `audio` feature but no sound card — see
      # testharness/audioperf.rs.
      - name: Emulation speed with audio attached
        run: cargo test --release --features audio --test audioperf
      - name: cargo test build
        run: cargo build --tests --release
      - name: cargo test
        run: cargo test --release
      - name: Make desktop build
        run: cd ./examples/desktop && cargo build
      # The web build. Audio is compiled out on wasm; a fresh clone must keep building it.
      - name: wasm build
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown
      # Fail if any generated `path:line` doc link is broken (missing file or out-of-range
      # line). See docs/codemap.md and `make docs-links`.
      - name: docs link check
        run: make docs-check

  # The embedding build: the core with NO features at all. This job deliberately
  # installs no system libraries and runs on a runner with no display and no
  # sound card, because that is what someone pulling this crate into their own
  # UI or a hardware project has. If a frontend concern ever leaks back into the
  # core, this is what turns red. See README "Embedding the core".
  embed:
    name: Embeddable core (no default features)
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v3   # deliberately NO submodules: the ROM below is vendored
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install stable --profile minimal
      - run: rustup component add clippy
      - name: Build, lint and test the core alone
        run: |
          cargo build --release --no-default-features
          cargo clippy --release --no-default-features --all-targets -- -D warnings
          cargo test  --release --no-default-features --lib
      # One dependency, and it must stay that way. `blip_buf` is the APU's
      # resampler; anything else appearing here means a frontend crate has
      # leaked into the core's default path.
      - name: The core has exactly one dependency
        run: |
          deps=$(cargo tree --no-default-features --edges normal --prefix none \
                 | sort -u | grep -v '^gameboy ')
          echo "$deps"
          test "$deps" = "$(printf '%s' "$deps" | head -1)" || { echo "more than one dependency"; exit 1; }
          case "$deps" in blip_buf*) ;; *) echo "unexpected dependency"; exit 1 ;; esac
      # Run a real cartridge with no HOME, no display and no audio device. The
      # example exits non-zero if the save-state round trip diverges.
      - name: Run a ROM headless with no HOME and no display
        run: |
          env -u HOME -u XDG_CONFIG_HOME -u XDG_STATE_HOME -u DISPLAY -u WAYLAND_DISPLAY \
            cargo run --release --no-default-features --example headless -- \
            third_party/dmg-acid2/dmg-acid2.gb 240
      # Type-check the core for the platforms we cannot run here. These are
      # checks, not linked binaries — see the README's honest portability list.
      - name: Cross-check the core on other targets
        run: |
          for t in wasm32-unknown-unknown x86_64-pc-windows-gnu aarch64-unknown-linux-gnu; do
            rustup target add "$t"
            cargo check --no-default-features --lib --target "$t"
          done

  testroms:
    name: Test-ROM correctness harness
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive   # Blargg ROMs live in the tests/ submodule
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-gnu
      - name: Install ALSA development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Runs every ROM on BOTH consoles (DMG and CGB) headlessly and compares against
      # testharness/baseline.txt; red on any change from it, in either direction.
      # Verdicts are the ROM's own (serial string / cartridge RAM / the reference image
      # shipped with dmg-acid2) — never a hash of our own output, which cannot fail.
      # Two self-checks run first and abort if the comparison is vacuous. ~4s to run.
      - name: Run test-ROM harness
        run: cargo test --release --test testroms
      # On any baseline mismatch the harness dumps the actual frame(s) — keep them.
      - name: Upload frame artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testrom-frames
          path: target/testrom-artifacts/*.png
          if-no-files-found: ignore

  # The external suites: Mooneye GB, SameSuite and Mealybug Tearoom — 266 rows
  # that nothing in CI used to look at. Every point those suites measure was
  # protected by somebody remembering to re-run a scout by hand, which is how a
  # night that gained +96 rows could have lost them again unnoticed.
  #
  # The ROMs are NOT vendored: they are other people's work under other people's
  # licences, so they are fetched at run time from the versions pinned in
  # tools/fetch-test-suites.sh — the same "fetch, never vendor" pattern
  # conformance.yml uses for Blargg's ROMs, for the same reason.
  #
  # The expectations (testharness/*_baseline.txt) are the ROMs' own verdicts,
  # never a hash of our output, and the job is red on ANY change in either
  # direction. ~20s to fetch, ~2s to run all four groups.
  external-suites:
    name: External suites (Mooneye / SameSuite / Mealybug)
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v3       # no submodules: none of these live here
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-gnu
      - name: Fetch the suites (pinned; never vendored)
        run: make fetch-test-suites
      - name: Score every external suite against its baseline
        run: make test-external
      # Mealybug writes the frame it produced for every ROM; on a red build
      # those are what tells you *how* the PPU changed.
      - name: Upload Mealybug frames on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mealybug-frames
          path: target/mealybug/*.png
          if-no-files-found: ignore
